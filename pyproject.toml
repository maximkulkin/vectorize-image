[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorize-image"
version = "0.1.0"
description = "Trace a two-tone raster image into an SVG using bezier curve fitting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "Pillow>=9.0",
    "psygnal>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6>=6.5"]

[project.scripts]
vectorize-image = "vectorize_image.cli:main"

[project.gui-scripts]
vectorize-image-gui = "vectorize_image.gui.app:main"

[tool.setuptools]
packages = ["vectorize_image", "vectorize_image.document", "vectorize_image.gui"]

[tool.setuptools.package-data]
"vectorize_image.gui" = ["icons/*.svg"]

[tool.basedpyright]
include = ["vectorize_image", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "recommended"
# The few "recommended" rules that don't fit this codebase:
# numpy's indexing and most of its functions are typed as returning Any, so
# this would flag nearly every array expression.
reportAny = false
# Qt and argparse builder calls (addWidget, addAction, add_argument, ...)
# return values that are routinely and intentionally ignored.
reportUnusedCallResult = false
# MainWindow builds its widgets in _build_* helpers called from __init__,
# which this rule can't see through.
reportUninitializedInstanceVariable = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "tests"]
# Tests deliberately inspect and drive internals.
reportPrivateUsage = false
