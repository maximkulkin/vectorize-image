[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorize-image"
version = "0.1.0"
description = "Trace a two-tone raster image into an SVG using bezier curve fitting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "Pillow>=9.0",
    "psygnal>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6>=6.5"]

[project.scripts]
vectorize-image = "vectorize_image.cli:main"

[project.gui-scripts]
vectorize-image-gui = "vectorize_image.gui.app:main"

[tool.setuptools]
packages = ["vectorize_image", "vectorize_image.gui"]

[tool.setuptools.package-data]
"vectorize_image.gui" = ["icons/*.svg"]
